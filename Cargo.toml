[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/allentown521/saladict"

[workspace.dependencies]
# ---- internal crates ----
saladict-core = { path = "crates/saladict-core" }
saladict-net = { path = "crates/saladict-net" }
saladict-platform = { path = "crates/saladict-platform" }
saladict-services = { path = "crates/saladict-services" }
saladict-plugin = { path = "crates/saladict-plugin" }
saladict-server = { path = "crates/saladict-server" }
saladict-ui = { path = "crates/saladict-ui" }

# ---- async / runtime ----
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
async-trait = "0.1"

# ---- serialization ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- error ----
anyhow = "1"
thiserror = "1"

# ---- http ----
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "charset",
    "http2",
    "rustls-tls",
    "macos-system-configuration",
] }
url = "2"
urlencoding = "2"

# ---- crypto (service signing) ----
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"

windows = { version = "0.39", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Globalization",
] }

# ---- storage ----
rusqlite = { version = "0.32", features = ["bundled"] }

# ---- system ----
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
notify = "6"
image = "0.25"
rqrr = "0.11"
arboard = "3.4"
selection = "1.2"
global-hotkey = "0.6"
tray-icon = "0.19"
# cross-platform capture / pointer
screenshots = "0.7.2"
mouse_position = "0.1.4"
tiny_http = "0.12"
lingua = { version = "1.6.2", default-features = false, features = [
    "chinese",
    "japanese",
    "english",
    "korean",
    "french",
    "spanish",
    "german",
    "russian",
    "italian",
    "portuguese",
    "turkish",
    "arabic",
    "vietnamese",
    "thai",
    "indonesian",
    "malay",
    "hindi",
    "mongolian",
    "persian",
    "nynorsk",
    "bokmal",
    "ukrainian",
] }

# ---- plugin runtime ----
rquickjs = "0.8"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
walkdir = "2.5"

# ---- ui ----
# gpui-shell 只随仓库发布（crates/shell 设置了 publish = false），
# 因此整个 UI 栈统一走同一个 git rev，避免 gpui-base 出现两份导致类型不匹配。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", features = [
    "component",
    "assets",
] }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit" }

# ---- platform-specific (only linked on the matching target) ----
