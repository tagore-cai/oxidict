[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/allentown521/saladict"

[workspace.dependencies]
# ---- internal crates ----
saladict-core = { path = "crates/saladict-core" }
saladict-net = { path = "crates/saladict-net" }
saladict-platform = { path = "crates/saladict-platform" }
saladict-services = { path = "crates/saladict-services" }
saladict-plugin = { path = "crates/saladict-plugin" }
saladict-server = { path = "crates/saladict-server" }
saladict-ui = { path = "crates/saladict-ui" }

# ---- async / runtime ----
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
async-trait = "0.1"

# ---- serialization ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- error ----
anyhow = "1"
thiserror = "1"

# ---- http ----
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "charset",
    "http2",
    "rustls-tls",
    "macos-system-configuration",
] }
url = "2"
urlencoding = "2"

# ---- crypto (service signing) ----
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"

windows = { version = "0.39", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Globalization",
] }

# ---- storage ----
rusqlite = { version = "0.32", features = ["bundled"] }

# ---- system ----
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
fern = "0.7"
notify = "6"
image = "0.25"
rqrr = "0.11"
arboard = "3.4"
selection = "1.2"
# 全局键盘监听（观察流制）：macOS CGEventTap / Windows WH_KEYBOARD_LL / Linux evdev。
# 替换 global-hotkey：其 Linux 后端仅 x11-dl，Wayland（Ubuntu 22.04+/Fedora 默认）下失效。
keytap = "0.4"
tray-icon = "0.19"
# cross-platform capture / pointer
screenshots = "0.7.2"
mouse_position = "0.1.4"
tiny_http = "0.12"
lingua = { version = "1.6.2", default-features = false, features = [
    "chinese",
    "japanese",
    "english",
    "korean",
    "french",
    "spanish",
    "german",
    "russian",
    "italian",
    "portuguese",
    "turkish",
    "arabic",
    "vietnamese",
    "thai",
    "indonesian",
    "malay",
    "hindi",
    "mongolian",
    "persian",
    "nynorsk",
    "bokmal",
    "ukrainian",
] }

fluent-templates = "0.13"
unic-langid = "0.9"

# ---- plugin runtime ----
# 插件 = ESM 模块导出纯函数（translate/recognize/tts/collection），由 rquickjs
# 直接驱动：无窗口、无渲染循环依赖，CLI / HTTP / UI 全上下文可调用。
# `futures` 提供 AsyncRuntime 与 Rust future <-> JS Promise 互转；
# `loader` 提供 FileResolver/BuiltinLoader 等模块加载设施。
rquickjs = { version = "0.8", features = ["futures", "loader"] }
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
walkdir = "2.5"

# ---- ui ----
# gpui-kit 已正式发布到 crates.io（0.6.1，2026-09-08），不再钉 git rev。
# feature 名与 git rev 时期一致：component（gpui-component）、assets（gpui-kit-assets）。
gpui-kit = { version = "0.6.1", features = [
    "component",
    "assets",
] }

# ---- platform-specific (only linked on the matching target) ----
# 注意：virtual workspace manifest 不允许 [target] 区块，平台特定依赖
# 写在各成员 crate 的 Cargo.toml 里（如 saladict-platform 的 objc2-app-kit）。

# ---- 统一 lint 基线（各成员 crate 通过 [lints] workspace = true 接入）----
# 目的：把「fmt/clippy 干净」从口头纪律变成清单内的强制约束，CI 再用 -D warnings 收口。
# 注意保持克制：只加当前代码库已经零告警通过的项；unwrap_used 等需要专项收敛后再启用。
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# gpui 0.6 的 API（Window/Context 等）大量使用省略生命周期的签名，
# 逐个补显式标注是纯噪声，故在组内豁免该条。
elided_lifetimes_in_paths = "allow"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# unwrap/expect：unwrap 一律禁止（测试文件内模块级豁免）；
# expect 允许，但 message 必须说明被违反的不变量。
unwrap_used = "warn"
