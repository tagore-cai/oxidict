name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送会取消还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GPUI 桌面应用（macOS 优先），在 macOS runner 上做全量验证。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 自动读取仓库根目录的 rust-toolchain.toml（钉死 1.98.1 + rustfmt + clippy），
      # 并内置 Swatinem/rust-cache 缓存。
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 格式化检查
        run: cargo fmt --all --check

      # -D warnings：任何 lint 告警（含 workspace.lints 基线）直接失败，防回退。
      - name: Clippy（0 告警基线）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --workspace --locked
